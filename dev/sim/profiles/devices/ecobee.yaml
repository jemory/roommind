description: Ecobee controlling a central heat pump in °F with heat_cool range (#277, #22).
model: heat_pump
capabilities:
  hvac_modes: ["off", "heat", "cool", "heat_cool"]
  fan_modes: ["auto", "on"]     # the air handler can run on its own (circulation)
  min_temp: 45
  max_temp: 92
  target_temp_step: 1
  unit: F
  range_setpoint: true
params:
  heat_capacity_w: 8000
  cool_capacity_w: 7000
  hysteresis_k: 0.5
  min_run_s: 300
  cop_heat: [2.8, 0.05]
  eer: 3.2
  shr: 0.7
  serves_rooms: []             # extra rooms reached by the ducts, with equal split
  defrost_interval_s: 2700     # air-source outdoor coil; 0 for a furnace
  defrost_s: 300
  defrost_action: heating
  circulation_ach: 2.5         # blower recirculation over the served rooms while conditioning
  fan_circulation_ach: 1.8     # the same with neither burner nor compressor (fan / fan_only)
  door_closed_return_factor: 0.35   # return-plenum share of a room behind a shut interior door
  door_closed_supply_factor: 0.75   # its duct supply share
quirks:
  - {type: rounding, whole_degrees: true}
