name: ekf-windowless-room
description: >
  Small heated store room without any window, so the true solar gain is zero, on a house run
  by one Central Plant. Forced-air heating against a light air node: after each run the room
  air relaxes towards the mass faster than a one-node model expects. The EKF must not book
  that (or anything else seen at night) as solar gain; before the fix its cross-covariances
  let night-time innovations move beta_s from 0.5 to ~3.7.
refs: [35]
tags: [model, mpc, central-plant]
start: 2026-01-12T00:00
duration: 10d
location: {latitude: 40.7, longitude: -74.0, time_zone: America/New_York, unit_system: us_customary, country: US}
weather: {profile: temperate}
house:
  building: us_wood_frame
  floors: {ground: Ground floor, upper: Upstairs}
  outdoor: {sensors: {temperature: sensor.outdoor_temp}}
  rooms:
    living_room:
      name: Living room
      floor: ground
      floor_area_m2: 30
      exterior_wall_m2: 18
      initial: {temperature: 19.5}
      devices:
        - {entity_id: climate.central_hvac, profile: central_furnace_hp, heat_capacity_w: 8000, serves_rooms: [store_room], supply_shares: {living_room: 0.8, store_room: 0.2}}
      sensors: {temperature: {entity_id: sensor.living_room_temp}}
    store_room:
      name: Store room
      floor: upper
      floor_area_m2: 12
      exterior_wall_m2: 8
      initial: {temperature: 19.5}
      windows: []
      sensors: {temperature: {entity_id: sensor.store_room_temp}}
helpers:
  schedule:
    plan: {weekdays: ["06:00-08:00", "16:30-22:30"], weekend: ["07:30-23:00"]}
roommind:
  settings:
    outdoor_temp_sensor: sensor.outdoor_temp
    weather_entity: weather.simhome
    central_plant:
      thermostat_entity: climate.central_hvac
      nudge_delta_c: 1.5
      max_nudge_headroom_c: 3.0
      fallback_heat_c: 16.5
      fallback_cool_c: 27.0
      min_deadband_c: 2.5
      min_run_minutes: 10
      min_off_minutes: 5
      exterior_open_policy: pause_unless_door_closed
  rooms:
    living_room:
      temperature_sensor: sensor.living_room_temp
      climate_mode: heat_only
      comfort_heat: 20.0
      eco_heat: 17.5
    store_room:
      temperature_sensor: sensor.store_room_temp
      climate_mode: heat_only
      schedules: [{entity_id: schedule.plan}]
      comfort_heat: 20.0
      eco_heat: 17.5
expect:
  - {metric: model.learned_beta_s, room: store_room, max: 2.0, label: no solar gain learned without a window}
  - {metric: model.learned_alpha_per_h, room: store_room, min: 0.008, max: 0.03}
  # Forced-air reheat is fast, so the room is re-warmed in a few minutes; the vestigial
  # undershoot bound only catches a plant that never reaches the room at all.
  - metric: comfort.undershoot_kh
    room: store_room
    max: 30
    label: the plant reaches the store room
    known_failure: >-
      candidate: the forced-air reheat transient is not calibrated yet (the learned
      heating rate is measured against a small air node, so beta_h reads ~2x the
      delivered rate). Re-baseline before tightening.
