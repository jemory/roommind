name: central-stratified-fan-circulation
description: >
  Two-storey US wood-frame house on a clear late-spring day, one Central Plant
  (central_furnace_hp in the downstairs living_room, ducts also serving the upstairs
  office). The south office warms in the sun while the living_room sits near its cool
  floor at 20.5 °C, so the two Thermal Zones disagree in opposite directions. The
  whole-home optimizer must run Circulation to mix the stratified air instead of
  cooling the already cool living_room below its comfort floor, and it must keep every
  setpoint it sends inside the thermostat's range (ADR-0001, ADR-0003).
refs: [1, 3]
tags: [central-plant, circulation, stratified, occupancy]
start: 2026-05-18T00:00
duration: 2d
location: {latitude: 40.7, longitude: -74.0, time_zone: America/New_York, unit_system: us_customary, country: US}
weather: {profile: temperate, fixed: {cloud: 8}}
house:
  building: us_wood_frame
  floors: {ground: Ground floor, upper: Upstairs}
  outdoor: {sensors: {temperature: sensor.outdoor_temp}}
  rooms:
    living_room:
      name: Living room
      floor: ground
      floor_area_m2: 45
      exterior_wall_m2: 25
      initial: {temperature: 20.5, mass_temperature: 20.5}
      windows: [{orientation: S, area_m2: 4, g_value: 0.6}]
      devices:
        - {entity_id: climate.central_hvac, profile: central_furnace_hp, serves_rooms: [office], supply_shares: {living_room: 0.6, office: 0.4}}
      sensors:
        temperature: {entity_id: sensor.living_room_temp}
        occupancy: {entity_id: binary_sensor.living_room_presence}
    office:
      name: Office
      floor: upper
      floor_area_m2: 18
      exterior_wall_m2: 12
      initial: {temperature: 20.0, mass_temperature: 20.0}
      windows: [{orientation: S, area_m2: 5, g_value: 0.6}]
      sensors:
        temperature: {entity_id: sensor.office_temp}
        occupancy: {entity_id: binary_sensor.office_presence}
people:
  - id: robin
    plan:
      presence: {weekday: ["home@00:00"], weekend: ["home@00:00"]}
      rooms: {office: "09:00-17:00", living: "default"}
    rooms: {office: office, living: living_room}
roommind:
  settings:
    outdoor_temp_sensor: sensor.outdoor_temp
    weather_entity: weather.simhome
    central_plant:
      thermostat_entity: climate.central_hvac
      nudge_delta_c: 1.5
      max_nudge_headroom_c: 3.0
      fallback_heat_c: 16.5
      fallback_cool_c: 27.0
      min_deadband_c: 2.5
      min_run_minutes: 15
      min_off_minutes: 5
      min_fan_minutes: 20
      changeover_minutes: 20
      exterior_open_policy: pause_unless_door_closed
  rooms:
    living_room:
      temperature_sensor: sensor.living_room_temp
      occupancy_sensors: [binary_sensor.living_room_presence]
      climate_mode: auto
      comfort_heat: 21.5
      comfort_cool: 24.5
      eco_heat: 17.0
      eco_cool: 26.5
    office:
      temperature_sensor: sensor.office_temp
      occupancy_sensors: [binary_sensor.office_presence]
      climate_mode: auto
      comfort_heat: 20.0
      comfort_cool: 24.5
      eco_heat: 17.0
      eco_cool: 26.5
expect:
  - {invariant: no_rejected_commands}
  - {invariant: setpoints_within_device_range}
  # Afternoon: the office is 2-3 K past its cooling target while the living_room is
  # 1 K below its heating target. The blower alone equalizes the two rooms.
  - {check: "true_temp('office') > 24.5 and dev('climate.central_hvac').action == 'fan'", at: "+0d15h00m", label: circulation mixes the stratified house instead of cooling}
  - {check: "dev('climate.central_hvac').fan_mode == 'on'", at: "+0d16h30m", label: blower runs for Circulation}
  # Circulation must never take heat out of the cool downstairs room on its own
  - {check: "true_temp('living_room') >= 20.0", at: "+0d13h", label: living_room not chilled below its comfort floor}
  - {check: "true_temp('living_room') >= 20.0", at: "+0d17h", label: living_room still at its floor in the late afternoon}
  - {metric: room.temp_min, room: living_room, min: 19.8, label: living_room never falls out of its band}
  - {metric: room.temp_max, room: office, max: 29.0, label: neither zone runs away}
  # 2026-11-16 baseline: a blower-led plan is far cheaper than running the heat pump all day
  - {metric: device.electric_kwh, entity_id: climate.central_hvac, max: 15.0, label: two days of mixing stay cheap}
