name: covers-summer-heat-only
extends: covers-solar-south
description: >
  The south room of covers-solar-south without any cooling, in a mild June week: a
  furnace-only house (all rooms heat_only, the plant never cools). Shading protects the
  comfort ceiling (comfort_cool), not the heating setpoint (#418), so the blind may only
  close once the sun would push the room past that ceiling.
refs: [418]
tags: [covers, solar, central-plant]
start: 2026-06-15T00:00
duration: 5d
weather: {profile: temperate}
house:
  rooms:
    living_room:
      initial: {temperature: 22.0, mass_temperature: 22.0}
      windows: [{orientation: S, area_m2: 2.5, g_value: 0.6}]
roommind:
  rooms:
    living_room:
      climate_mode: heat_only
      comfort_heat: 21.0
      eco_heat: 18.0
    office:
      climate_mode: heat_only
      comfort_heat: 21.0
      eco_heat: 18.0
timeline: []
expect:
  - {invariant: no_rejected_commands}
  # day 1 stays open on every version: no learned model yet, and the 1 h linear estimate stays below the threshold
  - {metric: cover.sunny_days_unshaded, entity_id: cover.living_room_blind, max: 1, label: shades on sunny afternoons}
  - {metric: cover.max_commands_per_day, entity_id: cover.living_room_blind, max: 6, label: few moves per day}
