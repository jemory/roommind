name: ekf-resync-after-gap
description: >
  Bedroom whose temperature sensor drops out for four hours on a cold night while the room
  cools by a couple of degrees, then comes back. The house is run by one Central Plant and
  training is paused during the gap, so the model temperature is hours old when it resumes, as
  after an HA outage and restart. Learning that jump as one cycle's change used to drag the
  heat-loss rate up, which made pre-heating start hours early (#478). The model must come out
  of the gap as it went in.
refs: [478]
tags: [model, mpc, central-plant]
start: 2026-01-12T00:00
duration: 5d04h30m
location: {latitude: 40.7, longitude: -74.0, time_zone: America/New_York, unit_system: us_customary, country: US}
weather: {profile: temperate}
house:
  building: us_wood_frame
  floors: {ground: Ground floor, upper: Upstairs}
  outdoor: {sensors: {temperature: sensor.outdoor_temp}}
  rooms:
    living_room:
      name: Living room
      floor: ground
      floor_area_m2: 30
      exterior_wall_m2: 18
      initial: {temperature: 20.0}
      devices:
        - {entity_id: climate.central_hvac, profile: central_furnace_hp, heat_capacity_w: 8000, serves_rooms: [bedroom], supply_shares: {living_room: 0.65, bedroom: 0.35}}
      sensors: {temperature: {entity_id: sensor.living_room_temp}}
    bedroom:
      name: Bedroom
      floor: upper
      floor_area_m2: 16
      exterior_wall_m2: 11
      initial: {temperature: 20.0}
      windows: [{orientation: N, area_m2: 1.8}]
      sensors:
        temperature: {entity_id: sensor.bedroom_temp}
helpers:
  schedule:
    plan: {daily: ["07:00-22:00"]}
roommind:
  settings:
    outdoor_temp_sensor: sensor.outdoor_temp
    weather_entity: weather.simhome
    central_plant:
      thermostat_entity: climate.central_hvac
      nudge_delta_c: 1.5
      max_nudge_headroom_c: 3.0
      fallback_heat_c: 16.5
      fallback_cool_c: 27.0
      min_deadband_c: 2.5
      min_run_minutes: 10
      min_off_minutes: 5
      exterior_open_policy: pause_unless_door_closed
  rooms:
    living_room:
      temperature_sensor: sensor.living_room_temp
      climate_mode: heat_only
      comfort_heat: 21.0
      eco_heat: 17.0
    bedroom:
      temperature_sensor: sensor.bedroom_temp
      climate_mode: heat_only
      schedules: [{entity_id: schedule.plan}]
      comfort_heat: 21.0
      eco_heat: 16.0
timeline:
  - {at: "+5d00h00m", do: entity.unavailable, entity_id: sensor.bedroom_temp}
  # restart inside the gap (5 s in the sim): the sensor gap triggers the resync either way,
  # the start path itself is covered by a unit test
  - {at: "+5d02h00m", do: ha.restart}
  - {at: "+5d04h00m", do: entity.available, entity_id: sensor.bedroom_temp}
expect:
  - {invariant: no_rejected_commands}
  - {invariant: setpoints_within_device_range}
  # 30 min after the gap: v1.8.0 0.039 (the jump learned as heat loss), fixed 0.017,
  # the same room without the gap 0.015
  - {metric: model.learned_alpha_per_h, room: bedroom, min: 0.008, max: 0.025}
