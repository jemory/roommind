name: air-quality-co2-ventilation
description: >
  Office with a CO2 sensor and an exhaust fan (input_boolean) in a house run by one Central
  Plant. The CO2 is a template sensor integrated every minute: one person in the room adds
  600 ppm/h (18 l/h in 30 m³), air change 0.5/h with the fan off and 4/h with it on, outdoor
  air 420 ppm. RoomMind judges the air bad from 1000 ppm, good again below 800, and runs the
  fan for at least 15 min. Day 1 the fan is switched on by hand while the air is good
  (RoomMind must leave it alone), later switched off by hand while RoomMind runs it (it stays
  off for that bad spell); day 2 climate control of the room is off (nothing switched on, the
  air is still judged). A restart in the middle of a run (day 0 10:47) must not end it.
refs: [267]
tags: [air-quality, presence, central-plant]
extends: occupancy-eco-office
duration: 3d
helpers:
  input_boolean:
    office_fan: {name: Office fan}
  template:
    - trigger:
        - trigger: time_pattern
          minutes: "/1"
      sensor:
        - name: Office CO2
          unique_id: sim_office_co2
          unit_of_measurement: ppm
          device_class: carbon_dioxide
          state_class: measurement
          state: >-
            {% set c = this.state | float(450) %}
            {% set occ = 10 if is_state('binary_sensor.office_presence', 'on') else 0 %}
            {% set n = 4.0 if is_state('input_boolean.office_fan', 'on') else 0.5 %}
            {{ (c + occ - n / 60 * (c - 420)) | round(0) }}
roommind:
  rooms:
    office:
      occupancy_mode: follow_schedule
      co2_sensor: sensor.office_co2
      ventilation_entity: input_boolean.office_fan
timeline:
  - {at: "+0d10h47m", do: ha.restart}
  - {at: "+1d06h00m", do: ha.service, service: input_boolean.turn_on, data: {entity_id: input_boolean.office_fan}}
  - {at: "+1d06h50m", do: ha.service, service: input_boolean.turn_off, data: {entity_id: input_boolean.office_fan}}
  - {at: "+1d09h52m", do: ha.service, service: input_boolean.turn_off, data: {entity_id: input_boolean.office_fan}}
  - {at: "+2d00h00m", do: roommind.ws, type: roommind/rooms/save, area_id: office, climate_control_enabled: false}
expect:
  - {invariant: no_rejected_commands}
  - {check: "room.office.co2 < 1000 and room.office.air_quality_bad == true and state('input_boolean.office_fan') == 'on'", at: "+0d09h50m", label: on from 1000 ppm and bad until below 800}
  - {check: "room.office.air_quality_bad == false and room.office.ventilation_active == true", at: "+0d09h57m", label: good again but the min run holds}
  - {check: "state('input_boolean.office_fan') == 'off' and room.office.ventilation_active == false", at: "+0d10h05m", label: off after the min run}
  - {check: "state('input_boolean.office_fan') == 'on' and room.office.ventilation_active == true", at: "+0d10h52m", label: a run goes on across a restart}
  - {check: "state('input_boolean.office_fan') == 'off'", at: "+0d11h05m", label: and ends after its min run}
  - {check: "state('input_boolean.office_fan') == 'on' and room.office.ventilation_active == false", at: "+1d06h45m", label: a fan switched on by hand is left alone}
  - {check: "room.office.air_quality_bad == true and state('input_boolean.office_fan') == 'off'", at: "+1d11h", label: switched off by hand during a bad spell stays off}
  - {check: "room.office.air_quality_bad == true and state('input_boolean.office_fan') == 'off'", at: "+2d12h", label: climate control off switches nothing on}
  - {metric: room.ventilation_shortest_run_min, room: office, min: 15}
  - {metric: room.ventilation_starts, room: office, min: 8, max: 20}
  - {metric: room.ventilation_ended_by_hand, room: office, min: 1, max: 1}
