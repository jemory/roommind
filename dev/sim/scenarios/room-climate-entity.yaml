name: room-climate-entity
description: >
  The room climate entity (#238) driven like a thermostat card, an automation or a voice
  assistant would, in a house run by one Central Plant: a set temperature and the eco
  preset hold until the next schedule change, hvac mode off stops control of the room, heat
  resumes it.
refs: [238, 425]
tags: [entities, override, schedule, central-plant]
start: 2026-01-12T00:00
duration: 2d
location: {latitude: 40.7, longitude: -74.0, time_zone: America/New_York, unit_system: us_customary, country: US}
weather: {profile: temperate}
house:
  building: us_wood_frame
  outdoor: {sensors: {temperature: sensor.outdoor_temp}}
  rooms:
    living_room:
      name: Living room
      floor_area_m2: 30
      exterior_wall_m2: 18
      initial: {temperature: 19.0}
      windows: [{orientation: S, area_m2: 3}]
      devices:
        - {entity_id: climate.central_hvac, profile: central_furnace_hp, heat_capacity_w: 7000}
      sensors: {temperature: {entity_id: sensor.living_room_temp}}
people:
  - {id: anna, profile: commuter, rooms: {living: living_room}}
helpers:
  schedule:
    plan_living: {weekdays: ["06:00-08:00", "16:30-22:30"], weekend: ["07:30-23:00"]}
roommind:
  settings:
    outdoor_temp_sensor: sensor.outdoor_temp
    weather_entity: weather.simhome
    central_plant:
      thermostat_entity: climate.central_hvac
      nudge_delta_c: 1.5
      max_nudge_headroom_c: 3.0
      fallback_heat_c: 16.5
      fallback_cool_c: 27.0
      min_deadband_c: 2.5
      min_run_minutes: 10
      min_off_minutes: 5
      exterior_open_policy: pause_unless_door_closed
  rooms:
    living_room:
      temperature_sensor: sensor.living_room_temp
      climate_mode: heat_only
      schedules: [{entity_id: schedule.plan_living}]
      comfort_heat: 21.0
      eco_heat: 18.0
timeline:
  - {at: "+0d10h", do: ha.service, service: climate.set_temperature, data: {entity_id: climate.roommind_living_room, temperature: 22.5}}
  - {at: "+0d23h", do: ha.service, service: climate.set_preset_mode, data: {entity_id: climate.roommind_living_room, preset_mode: comfort}}
  - {at: "+1d16h", do: ha.service, service: climate.set_hvac_mode, data: {entity_id: climate.roommind_living_room, hvac_mode: "off"}}
  - {at: "+1d19h", do: ha.service, service: climate.set_hvac_mode, data: {entity_id: climate.roommind_living_room, hvac_mode: heat}}
expect:
  - {check: "room.living_room.override_active == true and room.living_room.heat_target == 22.5", at: "+0d10h05m", label: set temperature holds}
  - {check: "room.living_room.override_active == true", at: "+0d16h25m", label: hold lasts until the schedule changes}
  - {check: "room.living_room.override_active == false and room.living_room.heat_target == 21.0", at: "+0d16h35m", label: schedule takes over at its next change}
  - {check: "room.living_room.override_active == true and room.living_room.heat_target == 21.0", at: "+1d00h", label: comfort preset during the eco period}
  - {check: "room.living_room.override_active == false and room.living_room.heat_target == 21.0", at: "+1d06h05m", label: comfort preset ends at the next block}
  - {check: "room.living_room.heat_target == 18.0", at: "+1d08h30m", label: back on schedule after the block}
  - {check: "dev('climate.central_hvac').mode == 'heat'", at: "+1d15h55m", label: the furnace is called before the comfort block}
  - {check: "room.living_room.force_off == true", at: "+1d16h05m", label: hvac off stops control of the room}
  - {check: "room.living_room.force_off == true and true_temp('living_room') < 20.0", at: "+1d18h55m", label: the room is left alone through the comfort block}
  - {check: "room.living_room.force_off == false", at: "+1d19h10m", label: hvac heat resumes control}
