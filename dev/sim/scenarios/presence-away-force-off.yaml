name: presence-away-force-off
description: >
  One Central Plant, presence_away_action off. When everybody leaves, the Central Thermostat
  must be switched off, not parked in the Fallback Band or left circulating (#368, #306).
refs: [368, 306]
tags: [presence, central-plant]
start: 2026-01-12T00:00
duration: 2d
location: {latitude: 40.7, longitude: -74.0, time_zone: America/New_York, unit_system: us_customary, country: US}
weather: {profile: temperate}
house:
  building: us_wood_frame
  outdoor: {sensors: {temperature: sensor.outdoor_temp}}
  rooms:
    living_room:
      name: Living room
      floor_area_m2: 30
      exterior_wall_m2: 18
      initial: {temperature: 20.0}
      windows: [{orientation: S, area_m2: 3}]
      devices:
        - {entity_id: climate.central_hvac, profile: central_furnace_hp, heat_capacity_w: 7000}
      sensors: {temperature: {entity_id: sensor.living_room_temp}}
people:
  - {id: anna, profile: commuter, rooms: {living: living_room}}
roommind:
  settings:
    outdoor_temp_sensor: sensor.outdoor_temp
    weather_entity: weather.simhome
    presence_enabled: true
    presence_persons: [person.anna]
    presence_away_action: "off"
    central_plant:
      thermostat_entity: climate.central_hvac
      nudge_delta_c: 1.5
      max_nudge_headroom_c: 3.0
      fallback_heat_c: 16.5
      fallback_cool_c: 27.0
      min_deadband_c: 2.5
      min_run_minutes: 10
      min_off_minutes: 5
      idle_fan_mode: auto
      exterior_open_policy: pause_unless_door_closed
  rooms:
    living_room:
      temperature_sensor: sensor.living_room_temp
      climate_mode: heat_only
      comfort_heat: 21.0
      eco_heat: 18.0
expect:
  - {invariant: no_rejected_commands}
  - {invariant: setpoints_within_device_range}
  - {check: "room.living_room.presence_away == true", at: "+0d09h", label: away detected}
  - {check: "dev('climate.central_hvac').mode == 'off'", at: "+0d09h", label: the plant is off while away, not parked in the fallback band}
  - {check: "room.living_room.presence_away == false", at: "+0d19h", label: presence is back}
  - {check: "dev('climate.central_hvac').mode != 'off'", at: "+0d19h", label: plant running again after the return}
