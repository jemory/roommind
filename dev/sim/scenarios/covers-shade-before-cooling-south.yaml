name: covers-shade-before-cooling-south
extends: covers-shade-before-cooling
description: >
  Same south room with the cover orientation set (180). Orientation decides when the sun
  is on the window, GHI how strong: the blind closes when the sun reaches the facade, not
  at sunrise for the midday sun, and only as far as needed.
tags: [covers, solar, central-plant]
roommind:
  rooms:
    living_room:
      cover_orientations: {cover.living_room_blind: 180}
expect+:
  - {metric: cover.earliest_first_move_h, entity_id: cover.living_room_blind, min: 8.5, label: first move once the sun is on the south facade}
