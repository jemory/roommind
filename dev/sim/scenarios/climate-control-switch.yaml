name: climate-control-switch
extends: climate-control-disabled
description: >
  switch.roommind_climate_control (#291) mirrors the global climate control setting. Off
  through the entity: RoomMind stops sending commands, a setpoint the user turns in on the
  Central Thermostat by hand stays there. A reload in between must keep the entity. On again
  through the entity: RoomMind takes the plant over and heats again.
refs: [291, 36]
roommind:
  settings:
    climate_control_active: true
timeline:
  - {at: "+1d06h", do: ha.service, service: switch.turn_off, data: {entity_id: switch.roommind_climate_control}}
  # 63 °F = 17.2 °C, turned in at the wall thermostat by hand
  - {at: "+1d06h05m", do: device.manual, entity_id: climate.central_hvac, hvac_mode: heat, temperature: 63}
  - {at: "+1d07h", do: roommind.reload}
  - {at: "+1d18h", do: ha.service, service: switch.turn_on, data: {entity_id: switch.roommind_climate_control}}
expect:
  - {invariant: no_commands_when_climate_off}
  - {invariant: no_rejected_commands}
  - {check: "true_temp('living_room') > 20.5", at: "+1d05h", label: RoomMind holds the room while climate control is on}
  - {check: "dev('climate.central_hvac').mode == 'heat' and dev('climate.central_hvac').target == 63 and true_temp('living_room') < 18.5", at: "+1d17h", label: the hand-set wall thermostat stays as it is while climate control is off}
  - {check: "dev('climate.central_hvac').mode != 'off'", at: "+1d18h30m", label: on again through the entity after a reload takes the plant over}
  - {check: "dev('climate.central_hvac').action == 'heating'", at: "+1d20h", label: the furnace runs again for the occupied house}
