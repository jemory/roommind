name: covers-schedule-helper-deleted
refs: [499]
description: >
  Bedroom shutter under night close whose room still lists a force cover schedule helper
  that was deleted in Home Assistant (schedule.deleted exists neither as state nor in the
  registry), on a house run by one Central Plant. The day starts at noon with the shutter
  open; at 15:00 it is closed by hand, so night close finds it already down. A hand-closed
  shutter stays whoever's it was: RoomMind must not open it in the morning. Before the fix
  the missing helper counted as "not loaded yet" for good, so the shutter was taken over as
  if found inside a forced phase after a start and opened in the morning.
tags: [covers, central-plant]
start: 2026-11-10T12:00
duration: 2d
location: {latitude: 40.7, longitude: -74.0, time_zone: America/New_York, unit_system: us_customary, country: US}
weather: {profile: temperate, fixed: {cloud: 60}}
external_entities: [schedule.deleted]  # referenced by the room, never created: deleted in HA
house:
  building: us_wood_frame
  floors: {ground: Ground floor, upper: Upstairs}
  outdoor: {sensors: {temperature: sensor.outdoor_temp}}
  rooms:
    living_room:
      name: Living room
      floor: ground
      floor_area_m2: 32
      exterior_wall_m2: 20
      initial: {temperature: 19.5, mass_temperature: 19.5}
      devices:
        - {entity_id: climate.central_hvac, profile: central_furnace_hp, heat_capacity_w: 7000, serves_rooms: [bedroom], supply_shares: {living_room: 0.7, bedroom: 0.3}}
      sensors:
        temperature: {entity_id: sensor.living_room_temp}
    bedroom:
      name: Bedroom
      floor: upper
      floor_area_m2: 16
      exterior_wall_m2: 11
      initial: {temperature: 19.0, mass_temperature: 19.0}
      windows: [{orientation: S, area_m2: 1.8}]
      covers: [{entity_id: cover.bedroom_blind, profile: roller_shutter}]
      sensors:
        temperature: {entity_id: sensor.bedroom_temp}
roommind:
  settings:
    outdoor_temp_sensor: sensor.outdoor_temp
    weather_entity: weather.simhome
    central_plant:
      thermostat_entity: climate.central_hvac
      nudge_delta_c: 1.5
      max_nudge_headroom_c: 3.0
      fallback_heat_c: 16.5
      fallback_cool_c: 27.0
      min_deadband_c: 2.5
      min_run_minutes: 10
      min_off_minutes: 5
      exterior_open_policy: pause_unless_door_closed
  rooms:
    living_room:
      temperature_sensor: sensor.living_room_temp
      climate_mode: heat_only
      comfort_heat: 21.0
      eco_heat: 17.0
    bedroom:
      temperature_sensor: sensor.bedroom_temp
      climate_mode: heat_only
      comfort_heat: 19.0
      eco_heat: 16.0
      covers: [cover.bedroom_blind]
      covers_auto_enabled: true
      covers_night_close: true
      covers_night_position: 0
      cover_schedules: [{entity_id: schedule.deleted, mode: force}]
timeline:
  - {at: "+0d03h", do: ha.service, service: cover.close_cover, data: {entity_id: cover.bedroom_blind}}
expect:
  - {invariant: no_rejected_commands}
  - {check: "cover('cover.bedroom_blind').position > 90", at: "+0d02h50m", label: open before the hand close}
  - {check: "cover('cover.bedroom_blind').position < 10", at: "+0d06h00m", label: down at night}
  - {check: "cover('cover.bedroom_blind').position < 10", at: "+0d23h00m", label: hand-closed shutter stays closed in the morning}
  - {metric: cover.max_commands_per_day, entity_id: cover.bedroom_blind, max: 2, label: no extra moves}
