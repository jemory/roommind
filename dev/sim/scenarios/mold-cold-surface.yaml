name: mold-cold-surface
description: >
  Unheated, damp hallway that the ducted Central Plant does not serve, in a wood-frame house
  during hard frost (mold_f_rsi 0.65, doors closed): its coldest wall spot drops below 5 °C.
  That wall is where condensate forms first, so the risk must still be reported with the real
  surface humidity. Before, a surface below 5 °C always read "ok" with surface RH 0 %.
tags: [mold, humidity, central-plant]
extends: mold-prevention-unheated-room
house:
  rooms:
    hallway:
      exterior_wall_m2: 12
      initial: {temperature: 9.0, humidity: 80}
      neighbors: {bathroom: closed_door, living_room: closed_door}
roommind:
  settings:
    mold_f_rsi: 0.65
expect:
  - {check: "room.hallway.mold_surface_temp < 5 and room.hallway.mold_risk_level == 'critical' and room.hallway.mold_surface_rh > 95", at: "+0d08h30m", label: a wall below 5 °C still reports the risk}
  # The dry night after: ok, but with the real surface humidity, not 0 %
  - {check: "room.hallway.mold_surface_temp < 5 and room.hallway.mold_risk_level == 'ok' and room.hallway.mold_surface_rh > 50", at: "+1d02h", label: a dry cold wall is ok with its real surface humidity}
