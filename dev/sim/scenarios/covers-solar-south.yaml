name: covers-solar-south
description: >
  July, single-family house on one Central Plant. The south-facing living_room carries an
  exterior venetian blind under automatic control; the blind shades on hot sunny
  afternoons and opens again in the evening. Someone working in the room must not trigger
  shading on its own (#418, #325). RoomMind's own moves never count as manual; real manual
  moves on day 3 pause the automatic control and the manual night position is kept. A
  second shade is configured read-only: it is only mirrored for the plan, never moved.
refs: [418, 325]
tags: [covers, solar, central-plant]
start: 2026-07-06T00:00
duration: 3d
location: {latitude: 33.75, longitude: -84.39, time_zone: America/New_York, unit_system: us_customary, country: US}
weather: {profile: hot-summer}
house:
  building: us_wood_frame
  floors: {ground: Ground floor, upper: Upstairs}
  outdoor: {sensors: {temperature: sensor.outdoor_temp}}
  rooms:
    living_room:
      name: Living room
      floor: ground
      floor_area_m2: 32
      exterior_wall_m2: 20
      initial: {temperature: 25.0, mass_temperature: 25.0}
      windows: [{orientation: S, area_m2: 6, g_value: 0.6}]
      covers:
        - {entity_id: cover.living_room_blind, profile: venetian_blind}
        - {entity_id: cover.living_room_side_shade, profile: roller_shutter, windows: []}
      devices:
        - {entity_id: climate.central_hvac, profile: central_furnace_hp, serves_rooms: [office], supply_shares: {living_room: 0.6, office: 0.4}}
      sensors:
        temperature: {entity_id: sensor.living_room_temp}
        occupancy: {entity_id: binary_sensor.living_room_presence}
    office:
      name: Office
      floor: upper
      floor_area_m2: 18
      exterior_wall_m2: 12
      initial: {temperature: 25.0}
      windows: [{orientation: S, area_m2: 3, g_value: 0.6}]
      sensors:
        temperature: {entity_id: sensor.office_temp}
        occupancy: {entity_id: binary_sensor.office_presence}
people:
  - id: robin
    plan:
      presence: {weekday: ["home@00:00"], weekend: ["home@00:00"]}
      rooms: {office: "09:00-17:00", living: "default"}
    rooms: {office: office, living: living_room}
roommind:
  settings:
    outdoor_temp_sensor: sensor.outdoor_temp
    weather_entity: weather.simhome
    central_plant:
      thermostat_entity: climate.central_hvac
      nudge_delta_c: 1.5
      max_nudge_headroom_c: 3.0
      fallback_heat_c: 17.0
      fallback_cool_c: 27.0
      min_deadband_c: 2.5
      min_run_minutes: 15
      min_off_minutes: 5
      exterior_open_policy: pause_unless_door_closed
  rooms:
    living_room:
      temperature_sensor: sensor.living_room_temp
      occupancy_sensors: [binary_sensor.living_room_presence]
      climate_mode: cool_only
      comfort_cool: 24.5
      eco_cool: 27.0
      covers: [cover.living_room_blind]
      read_only_covers: [cover.living_room_side_shade]
      covers_auto_enabled: true
    office:
      temperature_sensor: sensor.office_temp
      occupancy_sensors: [binary_sensor.office_presence]
      climate_mode: cool_only
      comfort_cool: 24.5
      eco_cool: 27.0
timeline:
  # day 3: someone opens the shaded blind for the balcony door, later closes it for the night.
  # Shading starts between 12:00 and 14:10 depending on the weather seed; at 15:00 it runs on all.
  - {at: "+2d15h", do: cover.manual, entity_id: cover.living_room_blind, position: 100}
  - {at: "+2d21h", do: cover.manual, entity_id: cover.living_room_blind, position: 10}
expect:
  - {invariant: no_rejected_commands}
  - {invariant: setpoints_within_device_range}
  - {check: "cover('cover.living_room_blind').position < 90", at: "+1d15h", label: shades in the afternoon}
  # 7-8 moves a day while the afternoon excess fell in 20 % steps every 15 min
  - {metric: cover.max_commands_per_day_unattended, entity_id: cover.living_room_blind, max: 6, label: cover moves per day}
  # day 3: one more move to shade again after the manual opening (6-7 on seeds 1-4)
  - {metric: cover.max_commands_per_day, entity_id: cover.living_room_blind, max: 7, label: cover moves on the day of the manual opening}
  # RoomMind's own moves, read mid-travel included, are never taken for a user move
  - {check: "room.living_room.cover_auto_paused == false", at: "+0d18h35m", label: own deploy step is not a manual move (day 1)}
  - {check: "room.living_room.cover_auto_paused == false", at: "+1d06h55m", label: own morning deploy is not a manual move}
  - {check: "room.living_room.cover_auto_paused == false", at: "+1d18h37m", label: own deploy step is not a manual move (day 2)}
  # Evening modulation ending near the baseline must still retract
  - {check: "cover('cover.living_room_blind').position > 98", at: "+0d23h", label: open at night (day 1)}
  - {check: "cover('cover.living_room_blind').position > 98 and room.living_room.cover_reason != 'user_position_hold'", at: "+1d23h", label: open at night (day 2)}
  - {check: "cover('cover.living_room_blind').position > 98", at: "+2d20h30m", label: open in the evening (day 3)}
  # Genuine manual moves are respected
  - {check: "room.living_room.cover_auto_paused == true", at: "+2d15h05m", label: manual opening pauses automatic control}
  - {check: "cover('cover.living_room_blind').position > 90", at: "+2d15h50m", label: manual opening is kept during the pause}
  - {check: "room.living_room.cover_auto_paused == true", at: "+2d21h05m", label: manual closing pauses automatic control}
  - {check: "cover('cover.living_room_blind').position < 20 and room.living_room.cover_auto_paused == false", at: "+2d23h30m", label: manual night position is kept after the pause}
  # The read-only shade belongs to someone else: mirrored, never commanded.
  - {metric: cover.commands, entity_id: cover.living_room_side_shade, max: 0, label: read-only shade is never moved}
