name: covers-night-close-reopen
refs: [499]
description: >
  Mid November, bedroom with a roller shutter under night close, offset +60 min
  (sunset ~17:35, sunrise ~07:20 local, so close ~18:35 and open ~08:20) on a house run by
  one Central Plant. Night 1 plain. Night 2 reloads RoomMind at 02:00 while the shutter is
  down, so the first cycle after it finds the shutter already at the night position. Night 3
  has a boost override set at 06:00 that still runs in the morning. Night 4 restarts Home
  Assistant at 02:00. Every morning the shutter must open again: nothing but night close put
  it down. A second shutter on the balcony door closes only to 30 % ("fully closed at");
  night close must send it once per evening, not every cycle.
tags: [covers, central-plant]
start: 2026-11-10T12:00
duration: 4d
location: {latitude: 40.7, longitude: -74.0, time_zone: America/New_York, unit_system: us_customary, country: US}
weather: {profile: temperate, fixed: {cloud: 60}}
house:
  building: us_wood_frame
  floors: {ground: Ground floor, upper: Upstairs}
  outdoor: {sensors: {temperature: sensor.outdoor_temp}}
  rooms:
    living_room:
      name: Living room
      floor: ground
      floor_area_m2: 32
      exterior_wall_m2: 20
      initial: {temperature: 19.5, mass_temperature: 19.5}
      windows: [{orientation: S, area_m2: 3, g_value: 0.6}]
      devices:
        - {entity_id: climate.central_hvac, profile: central_furnace_hp, heat_capacity_w: 7000, serves_rooms: [bedroom], supply_shares: {living_room: 0.7, bedroom: 0.3}}
      sensors:
        temperature: {entity_id: sensor.living_room_temp}
    bedroom:
      name: Bedroom
      floor: upper
      floor_area_m2: 16
      exterior_wall_m2: 11
      initial: {temperature: 19.0, mass_temperature: 19.0}
      windows: [{orientation: S, area_m2: 1.8}, {orientation: S, area_m2: 1.6}]
      covers:
        - {entity_id: cover.bedroom_blind, profile: roller_shutter}
        - {entity_id: cover.bedroom_door_shade, profile: roller_shutter}
      sensors:
        temperature: {entity_id: sensor.bedroom_temp}
roommind:
  settings:
    outdoor_temp_sensor: sensor.outdoor_temp
    weather_entity: weather.simhome
    central_plant:
      thermostat_entity: climate.central_hvac
      nudge_delta_c: 1.5
      max_nudge_headroom_c: 3.0
      fallback_heat_c: 16.5
      fallback_cool_c: 27.0
      min_deadband_c: 2.5
      min_run_minutes: 10
      min_off_minutes: 5
      exterior_open_policy: pause_unless_door_closed
  rooms:
    living_room:
      temperature_sensor: sensor.living_room_temp
      climate_mode: heat_only
      comfort_heat: 21.0
      eco_heat: 17.0
    bedroom:
      temperature_sensor: sensor.bedroom_temp
      climate_mode: heat_only
      comfort_heat: 19.0
      eco_heat: 16.0
      covers: [cover.bedroom_blind, cover.bedroom_door_shade]
      cover_min_positions: {cover.bedroom_door_shade: 30}
      covers_auto_enabled: true
      covers_night_close: true
      covers_night_position: 0
      covers_night_close_offset_minutes: 60
timeline:
  - {at: "+1d14h", do: roommind.reload}
  - {at: "+2d18h", do: roommind.ws, type: roommind/override/set, area_id: bedroom, override_type: boost, duration: 6}
  - {at: "+3d14h", do: ha.restart}
expect:
  - {invariant: no_rejected_commands}
  - {invariant: setpoints_within_device_range}
  - {check: "cover('cover.bedroom_blind').position > 90", at: "+0d04h50m", label: still open before sunset plus offset}
  - {check: "cover('cover.bedroom_blind').position < 10", at: "+0d07h00m", label: night close after sunset plus offset}
  - {check: "cover('cover.bedroom_blind').position < 10", at: "+0d20h00m", label: still closed at sunrise (offset +60)}
  - {check: "cover('cover.bedroom_blind').position > 90", at: "+0d22h00m", label: opens in the morning}
  - {check: "cover('cover.bedroom_blind').position < 10", at: "+1d07h00m", label: second night close}
  - {check: "cover('cover.bedroom_blind').position > 90", at: "+1d22h00m", label: opens after a reload in the night}
  - {check: "cover('cover.bedroom_blind').position < 10", at: "+2d07h00m", label: third night close}
  - {check: "cover('cover.bedroom_blind').position > 90", at: "+2d22h00m", label: opens with a room override running}
  - {check: "cover('cover.bedroom_blind').position < 10", at: "+3d07h00m", label: fourth night close}
  - {check: "cover('cover.bedroom_blind').position > 90", at: "+3d22h00m", label: opens after a restart in the night}
  - {metric: cover.max_commands_per_day, entity_id: cover.bedroom_blind, max: 3, label: cover moves per day}
  - {check: "cover('cover.bedroom_door_shade').position > 25 and cover('cover.bedroom_door_shade').position < 35", at: "+0d07h00m", label: door shutter stops at its minimum}
  - {check: "cover('cover.bedroom_door_shade').position > 90", at: "+0d22h00m", label: door shutter opens in the morning}
  - {metric: cover.max_commands_per_day, entity_id: cover.bedroom_door_shade, max: 3, label: door shutter not resent every cycle}
