name: covers-shade-before-cooling
extends: ekf-summer-cooling
description: >
  Shade first, cool the rest: the Central Plant can hold the south room on its own, so a
  cover decision based on the plan with cooling never shaded (the room was cooled with
  electricity while the sun shone in). The blind must close on sunny days because of the
  solar load, without following the compressor cycle (an earlier attempt moved it up to 29
  times a day). No cover orientation configured here, so GHI alone decides; the -south and
  -north variants set it.
tags: [covers, solar, central-plant]
duration: 5d
house:
  rooms:
    living_room:
      # A position-only shutter: RoomMind does not set slat angles, and the venetian
      # profile keeps its slats open when lowered (40 % of the shading RoomMind assumes).
      covers:
        - {entity_id: cover.living_room_blind, profile: roller_shutter}
        - {entity_id: cover.living_room_side_shade, profile: roller_shutter, windows: []}
roommind:
  rooms:
    living_room: {covers_auto_enabled: true}
expect:
  - {invariant: no_rejected_commands}
  - {invariant: setpoints_within_device_range}
  - {metric: cover.sunny_days_unshaded, entity_id: cover.living_room_blind, max: 0, label: shades on sunny afternoons although the plant could hold the room}
  - {metric: cover.max_commands_per_day, entity_id: cover.living_room_blind, max: 6, label: cover moves per day}
  - {metric: comfort.overshoot_kh, room: living_room, max: 9, label: cooling keeps the room near its target}
  # Shading the south window must cut the cooling energy the plant draws.
  - {metric: device.electric_kwh, entity_id: climate.central_hvac, max: 45, label: shading saves cooling energy}
