name: Release

on:
  # `push: tags` is the arrangement this workflow wants, but it does NOT fire on
  # this repository: deleting and re-pushing a tag, and pushing a fresh one, both
  # left the API with zero push runs while `workflow_dispatch` ran normally, and
  # publishing a release dispatches nothing here because this is a fork. Kept
  # because it is correct for any repository where it does fire; the supported
  # path is `dev/release`, which tags, dispatches and publishes in one step.
  push:
    tags: ["v*"]
  release:
    types: [published]
  # The path that works: dev/release calls this, and it can be run by hand to
  # rebuild an existing tag or repair a release whose asset is missing:
  #   gh workflow run release.yml -R <owner>/<repo> -f tag=v3.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload roommind.zip for
        required: true

jobs:
  build-and-upload:
    name: Build and upload release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Create release zip
        run: cd custom_components/roommind && zip -r ../../roommind.zip . -x "__pycache__/*"

      - name: Attach the asset to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" roommind.zip --clobber
          else
            # A tag push arrives before the release exists, and `gh release upload`
            # needs one. Park the asset on a DRAFT so the digest-checking install
            # path is ready while the notes can still be written before publishing.
            gh release create "$TAG" roommind.zip --draft --title "$TAG" --generate-notes
          fi
