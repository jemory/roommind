name: Release

on:
  release:
    types: [published]
  # Forked repositories do not dispatch `release` events until their workflows are
  # enabled, so the same build can be started by hand for an existing tag:
  #   gh workflow run release.yml -R <owner>/<repo> -f tag=v3.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload roommind.zip for
        required: true

jobs:
  build-and-upload:
    name: Build and upload release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Create release zip
        run: cd custom_components/roommind && zip -r ../../roommind.zip . -x "__pycache__/*"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" roommind.zip --clobber
