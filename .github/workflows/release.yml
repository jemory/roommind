name: Release

on:
  # Tagging is the release step: pushing a v* tag builds and uploads its asset even
  # on a fork, where a `release` event is not dispatched to the workflow.
  push:
    tags: ["v*"]
  release:
    types: [published]
  # Kept for re-building an existing tag or repairing a release whose asset is
  # missing, without cutting a new tag:
  #   gh workflow run release.yml -R <owner>/<repo> -f tag=v3.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload roommind.zip for
        required: true

jobs:
  build-and-upload:
    name: Build and upload release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Create release zip
        run: cd custom_components/roommind && zip -r ../../roommind.zip . -x "__pycache__/*"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" roommind.zip --clobber
